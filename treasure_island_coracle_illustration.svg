<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Georgia, serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16374f"/>
      <stop offset="45%" stop-color="#3d6d84"/>
      <stop offset="78%" stop-color="#a9bfae"/>
      <stop offset="100%" stop-color="#d8cfa8"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff3d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seaBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123a52"/>
      <stop offset="100%" stop-color="#08222f"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f7a92"/>
      <stop offset="100%" stop-color="#1c4f66"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c5f79"/>
      <stop offset="100%" stop-color="#123a4e"/>
    </linearGradient>
    <linearGradient id="waveFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a97ab"/>
      <stop offset="55%" stop-color="#2b5c72"/>
      <stop offset="100%" stop-color="#0e3244"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="900" height="330" fill="url(#sky)"/>
  <circle cx="640" cy="245" r="110" fill="url(#sun)"/>

  <!-- Spy-glass hill silhouette: one great rounded bulk, hazy in the distance -->
  <path d="M440,320 C450,270 500,205 590,195 C670,187 740,235 765,290 C775,305 778,313 780,320 Z"
        fill="#5c7c8a" opacity="0.55"/>
  <path d="M500,320 C512,285 555,255 610,255 C665,255 700,285 715,320 Z"
        fill="#4a6b78" opacity="0.55"/>

  <!-- sea base -->
  <rect x="0" y="300" width="900" height="260" fill="url(#seaBase)"/>

  <!-- distant calm swell bands -->
  <path d="M0,320 Q60,310 120,320 T240,320 T360,320 T480,320 T600,320 T720,320 T840,320 L900,320 L900,340 L0,340 Z"
        fill="#3a6478" opacity="0.5"/>
  <path d="M0,345 Q80,332 160,345 T320,345 T480,345 T640,345 T800,345 L900,345 L900,365 L0,365 Z"
        fill="#2f5769" opacity="0.55"/>

  <!-- mid-ground rolling swells -->
  <path d="M0,400 Q100,350 200,395 T400,390 T600,400 T800,385 L900,395 L900,560 L0,560 Z" fill="url(#wave1)"/>
  <path d="M0,430 Q120,470 260,435 T520,445 T780,430 L900,440 L900,560 L0,560 Z" fill="url(#wave2)" opacity="0.9"/>

  <!-- the big blue summit heaving close above, towering just behind the boat -->
  <path d="M0,480 C90,440 160,420 230,440 C280,455 300,470 340,455
           C400,432 430,340 500,335 C560,330 590,390 640,415
           C710,448 800,450 900,425
           L900,560 L0,560 Z" fill="url(#waveFront)"/>
  <!-- crest highlight -->
  <path d="M340,455 C400,432 430,340 500,335 C560,330 590,390 640,415" fill="none" stroke="#cdeef2" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
  <path d="M0,480 C90,440 160,420 230,440" fill="none" stroke="#bfe3ea" stroke-width="3" opacity="0.4" stroke-linecap="round"/>

  <!-- ================= coracle group, sitting low in the trough ================= -->
  <g transform="translate(300,490) rotate(-8) scale(1.15)">
    <!-- ripples / spray near the hull -->
    <path d="M-95,18 q10,-8 22,0 q10,8 22,0" fill="none" stroke="#dff2f5" stroke-width="2.5" opacity="0.75" stroke-linecap="round"/>
    <path d="M70,10 q9,-10 20,-3" fill="none" stroke="#eaf7f9" stroke-width="3" opacity="0.8" stroke-linecap="round"/>
    <path d="M80,20 q7,-6 15,-1" fill="none" stroke="#eaf7f9" stroke-width="2" opacity="0.6" stroke-linecap="round"/>

    <!-- hull: round, hide-covered coracle -->
    <ellipse cx="0" cy="6" rx="78" ry="24" fill="#7a5b3f"/>
    <ellipse cx="0" cy="6" rx="78" ry="24" fill="none" stroke="#4d3826" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="70" ry="18" fill="#93714f"/>
    <ellipse cx="0" cy="0" rx="70" ry="18" fill="none" stroke="#4d3826" stroke-width="2"/>

    <!-- Jim, hunched low, only his back and head above the gunwale -->
    <path d="M-26,-4 Q-16,-25 4,-25 Q23,-25 29,-9 Q12,-15 -7,-14 Q-19,-13 -26,-4 Z" fill="#4a3f33"/>
    <path d="M-16,-25 Q4,-25 23,-10" fill="none" stroke="#6b5b47" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
    <circle cx="28" cy="-13" r="6.5" fill="#3a3226"/>
    <circle cx="30" cy="-15" r="1.6" fill="#d8c9a3"/>
    <line x1="31" y1="-9" x2="35" y2="-3" stroke="#3a3226" stroke-width="3" stroke-linecap="round"/>

    <!-- paddle, dipped over the side -->
    <line x1="35" y1="-3" x2="124" y2="40" stroke="#6b4e2c" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="128" cy="43" rx="13" ry="5.5" fill="#6b4e2c" transform="rotate(28 128 43)"/>
  </g>

  <!-- foreground wave lip passing in front of the coracle for depth -->
  <path d="M150,505 C230,485 300,520 380,500 C420,490 460,470 520,485
           C600,505 700,495 780,510 L900,505 L900,560 L0,560 Z"
        fill="#0c2c3c" opacity="0.9"/>
  <path d="M150,505 C230,485 300,520 380,500 C420,490 460,470 520,485"
        fill="none" stroke="#a7d8de" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
</svg>
